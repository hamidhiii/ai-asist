services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai_asist
      POSTGRES_PASSWORD: ai_asist
      POSTGRES_DB: ai_asist
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_asist"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ai_asist:ai_asist@postgres:5432/ai_asist
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 180"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ai_asist:ai_asist@postgres:5432/ai_asist
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config worker -l info

  beat:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ai_asist:ai_asist@postgres:5432/ai_asist
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  whisper_cache:
